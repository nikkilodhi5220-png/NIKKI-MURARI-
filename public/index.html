<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inbox Direct Bulk Mailer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- APP CONTAINER -->
    <div class="app-container">
        <header class="app-header">
            <h1><i class="fa-solid fa-paper-plane"></i> Inbox Direct Mailer</h1>
            <button id="logout-btn" class="logout-header-btn">
                <i class="fa-solid fa-right-from-bracket"></i> <span id="logout-text">लॉग आउट</span>
            </button>
        </header>

        <div class="dashboard-grid">
            <!-- LEFT COLUMN -->
            <div class="composer-card card">
                <h3><i class="fa-solid fa-sliders"></i> Gmail & SMTP सेटिंग्स</h3>
                
                <form id="email-form">
                    <div class="form-row">
                        <div class="form-group half">
                            <label><i class="fa-solid fa-server"></i> SMTP होस्ट</label>
                            <input type="text" id="smtp-host" value="smtp.gmail.com" placeholder="smtp.gmail.com" required>
                        </div>
                        <div class="form-group half">
                            <label><i class="fa-solid fa-plug"></i> पोर्ट</label>
                            <input type="text" id="smtp-port" value="465" placeholder="465 या 587" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-envelope"></i> Gmail ID</label>
                        <input type="email" id="smtp-user" placeholder="your-email@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-key"></i> Gmail App Password (16-digit)</label>
                        <div class="password-wrapper">
                            <input type="password" id="smtp-pass" placeholder="xxxx xxxx xxxx xxxx" required>
                            <button type="button" id="toggle-pass" class="icon-button">
                                <i class="fa-solid fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <hr style="margin: 1rem 0; border: none; border-top: 1px solid var(--border-color);">

                    <div class="form-group">
                        <label><i class="fa-solid fa-user-tag"></i> भेजने वाले का नाम (Sender Name)</label>
                        <input type="text" id="sender-name" placeholder="उदा: Rahul Kumar" required>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-heading"></i> विषय (Subject)</label>
                        <input type="text" id="email-subject" placeholder="साफ़ और स्पष्ट विषय रखें..." required>
                    </div>

                    <div class="form-group">
                        <label><i class="fa-solid fa-code"></i> ईमेल संदेश (Clean Body)</label>
                        <p class="help-subtext">कोई एक्स्ट्रा फुटर या लाइन नहीं जोड़ी जाएगी।</p>
                        <textarea id="message-body" placeholder="अपना संदेश दर्ज करें..." required></textarea>
                    </div>

                    <button type="submit" id="send-btn" class="btn btn-primary btn-block">
                        <i class="fa-solid fa-paper-plane"></i> इनबॉक्स में भेजें
                    </button>
                </form>
            </div>

            <!-- RIGHT COLUMN -->
            <div class="right-column">
                <div class="recipients-card card">
                    <div class="card-header-flex">
                        <h3><i class="fa-solid fa-users"></i> प्राप्तकर्ता (Recipients)</h3>
                        <span id="recipient-count" class="badge">0 ईमेल</span>
                    </div>
                    <p class="help-subtext">प्रति पंक्ति 1 ईमेल (1 Email per Request Mode)</p>
                    <textarea id="recipients-input" placeholder="email1@gmail.com&#10;email2@yahoo.com" required></textarea>
                </div>

                <!-- PROGRESS MONITOR -->
                <div class="progress-card card">
                    <h3><i class="fa-solid fa-chart-line"></i> लाइव डिलीवरी स्टेटस</h3>
                    
                    <div class="stats-grid">
                        <div class="stat-box neutral">
                            <span class="stat-label">कुल</span>
                            <span id="stat-total" class="stat-value">0</span>
                        </div>
                        <div class="stat-box success">
                            <span class="stat-label">सफल</span>
                            <span id="stat-sent" class="stat-value">0</span>
                        </div>
                        <div class="stat-box danger">
                            <span class="stat-label">विफल</span>
                            <span id="stat-failed" class="stat-value">0</span>
                        </div>
                        <div class="stat-box warning">
                            <span class="stat-label">शेष</span>
                            <span id="stat-remaining" class="stat-value">0</span>
                        </div>
                    </div>

                    <div class="progress-bar-container">
                        <div id="progress-bar" class="progress-bar" style="width: 0%;"></div>
                    </div>

                    <div class="status-indicator">
                        <i class="fa-solid fa-circle-notch fa-spin text-primary hidden" id="status-spinner"></i>
                        <span id="status-text" class="text-muted">तैयार है...</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
